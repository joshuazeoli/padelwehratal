<title>Der neue Cube</title>
<meta name="description" content="Interaktives 3D-Modell der neuen Padelhalle von THE CUBE – Padelarena Wehr (35 × 38 m, Satteldach 10–12 m, 4 Courts).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=League+Spartan:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D canvas, one fixed control panel top-left. Single dark look (Cube Court-Blau). */
:root{--brand:#004aab;--akzent:#e6ff53;--akzent-text:#002b63;--bg:#041832;--karte:#0a3266;--sektion:#051f42;--weiss:#ffffff;--muted:#7a9cbf;color-scheme:dark;}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block;touch-action:none}
.ui{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:2;display:flex;flex-direction:column;gap:8px;max-width:min(540px,calc(100vw - 32px))}
.panel{background:rgba(4,24,50,.9);border:2px solid var(--brand);padding:10px 12px}
.title{font-family:'League Spartan',Inter,sans-serif;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px;line-height:1.1;display:flex;align-items:center;gap:10px}
.title img{height:26px;display:block}
.fold{margin-left:auto;padding:2px 9px;font-size:11px;line-height:1.4}
.ui.collapsed .body{display:none}
.ui.collapsed .panel{padding:6px 10px}
.sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
button{font:600 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--karte);color:#fff;border:2px solid var(--brand);padding:6px 9px;cursor:pointer}
button.on,button:hover{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--akzent);text-align:center;padding:24px}
#load>div{max-width:420px;line-height:1.5}
.shot .ui,.shot #load{display:none}
@media (max-width:600px){.ui{left:max(8px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));max-width:calc(100vw - 16px)}.panel{padding:8px}button{padding:5px 7px;font-size:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}
/* Rundgang: touch D-pad bottom centre, exit button */
#pad{display:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.walk #pad{display:grid}}
#pad button{font-size:20px;padding:0;background:rgba(4,24,50,.82);border-color:var(--brand);color:#fff;touch-action:none}
#pad button:hover{background:rgba(4,24,50,.82);color:#fff;border-color:var(--brand)}
#pad button.on,#pad button:active{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent)}
#pad .f{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .b{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#pad .x{grid-column:1/4;grid-row:3;font-size:11px;height:34px}
#pad{grid-template-rows:56px 56px 34px}
.walk #c{cursor:move}
.shot #pad{display:none}
</style>

function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const clamp255 = v => v<0?0:v>255?255:v;
function noiseFill(ctx,w,h,base,amp){
  const id = ctx.createImageData(w,h); const d = id.data; const [r,g,b] = hexRgb(base);
  for (let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*amp; d[i]=clamp255(r+n); d[i+1]=clamp255(g+n); d[i+2]=clamp255(b+n); d[i+3]=255; }
  ctx.putImageData(id,0,0);
}
function makeTex(w,h,draw){

  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; t.userData.canvas=c; return t;
}

function normalFrom(tex, strength=2, blur=0){

  const lum=(x,y)=>L[((y+h)%h)*w+((x+w)%w)];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const dx=(lum(x+1,y)-lum(x-1,y))*strength, dy=(lum(x,y+1)-lum(x,y-1))*strength; const nx=-dx, ny=dy, nz=1; const l=Math.hypot(nx,ny,nz); const i=(y*w+x)*4; d[i]=(nx/l*0.5+0.5)*255; d[i+1]=(ny/l*0.5+0.5)*255; d[i+2]=(nz/l*0.5+0.5)*255; d[i+3]=255; }

window.setView=setView; window.setRoof=setRoof; window.setNight=setNight;

setQuality(hiQ);
setView(params.get('view')||'ost');
if (params.get('roof')==='0') setRoof(false); if (params.get('roof')==='1') setRoof(true);
if (params.get('night')==='1') setNight(true);

const clock=new THREE.Clock();
function frame(){ if(!SHOT) requestAnimationFrame(frame); const dt=clock.getDelta(); if(walk.on) walkUpdate(dt); else controls.update(); composer.render(); }
function finish(){ window.__built=true; document.getElementById('load').remove(); frame(); if (SHOT){ composer.render(); composer.render(); window.__ready=true; } }
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(finish,60));
</script>
</body>
